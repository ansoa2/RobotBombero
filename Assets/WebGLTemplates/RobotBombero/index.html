<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#090C16">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>html, body { background: #090C16; }</style>
  </head>
  <body>
    <div id="contenedor">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="carga">
        <div id="carga-etiqueta">Simulador de reglas</div>
        <div id="carga-titulo">Robot Bombero</div>
        <div id="barra"><div id="barra-llena"></div></div>
        <div id="carga-texto">Cargando…</div>
      </div>
      <div id="avisos"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var carga = document.querySelector("#carga");
      var barra = document.querySelector("#barra-llena");
      var cargaTexto = document.querySelector("#carga-texto");

      function aviso(mensaje, tipo) {
        var zona = document.querySelector("#avisos");
        var div = document.createElement("div");
        div.textContent = mensaje;
        if (tipo === "error") div.className = "error";
        zona.appendChild(div);
        if (tipo !== "error") {
          setTimeout(function () { zona.removeChild(div); }, 5000);
        }
      }

      function errorDeCarga(mensaje) {
        barra.parentNode.style.display = "none";
        cargaTexto.textContent = mensaje;
      }

      // Pedir WebGL 2 aquí permite avisar antes de descargar nada en un móvil que no puede ejecutarlo.
      if (!document.createElement("canvas").getContext("webgl2")) {
        errorDeCarga("Este navegador no es compatible con WebGL 2. Prueba con un navegador actualizado u otro dispositivo.");
      } else {
        var buildUrl = "Build";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
          frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
          codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          showBanner: aviso,
          // LocalStore cuenta con esto: lo escrito en persistentDataPath se vuelca a IndexedDB sin llamadas extra.
          autoSyncPersistentDataPath: true
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onerror = function () {
          errorDeCarga("No se ha podido descargar el juego. Comprueba la conexión y recarga la página.");
        };
        script.onload = function () {
          createUnityInstance(canvas, config, function (progreso) {
            barra.style.width = (100 * progreso) + "%";
            cargaTexto.textContent = progreso < 1 ? "Cargando… " + Math.round(100 * progreso) + " %" : "Preparando…";
          }).then(function () {
            carga.style.display = "none";
          }).catch(function (mensaje) {
            errorDeCarga("No se ha podido iniciar el juego: " + mensaje);
          });
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
